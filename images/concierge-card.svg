<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="LabLink Concierge membership card">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123C43"/>
      <stop offset="1" stop-color="#0B3036"/>
    </linearGradient>
    <linearGradient id="cham" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3C88F"/>
      <stop offset="1" stop-color="#C4A66A"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <ellipse cx="300" cy="190" rx="250" ry="160" fill="#16866A" opacity="0.2" filter="url(#soft)"/>
  <ellipse cx="300" cy="210" rx="200" ry="130" fill="#D5B77A" opacity="0.12" filter="url(#soft)"/>

  <!-- shine sweep -->
  <polygon points="60,80 540,80 190,370 60,370" fill="rgba(255,255,255,0.05)"/>

  <!-- card -->
  <rect x="60" y="80" width="480" height="290" rx="22" fill="url(#cardGrad)" stroke="rgba(213,183,122,0.45)" stroke-width="2"/>

  <!-- contactless chip -->
  <rect x="110" y="150" width="64" height="48" rx="8" fill="url(#cham)"/>
  <path d="M122 150v48M134 150v48M146 150v48M158 150v48" stroke="rgba(18,60,67,0.4)" stroke-width="2"/>
  <circle cx="200" cy="174" r="14" fill="none" stroke="rgba(18,60,67,0.65)" stroke-width="3"/>
  <path d="M207 168a18 18 0 0 1 0 14M213 163a26 26 0 0 1 0 24" fill="none" stroke="rgba(18,60,67,0.5)" stroke-width="3" stroke-linecap="round"/>

  <!-- brand -->
  <text x="110" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#F7F9F7">Lab</text>
  <text x="176" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#D5B77A">Link</text>
  <text x="112" y="300" font-family="Arial, sans-serif" font-size="12.5" letter-spacing="4" fill="#8FC9C1" font-weight="700">PREMIUM DIAGNOSTICS</text>

  <!-- tier -->
  <text x="520" y="126" font-family="Arial, sans-serif" font-size="15" letter-spacing="5" fill="#D5B77A" font-weight="800" text-anchor="end">CONCIERGE</text>
  <text x="520" y="146" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="rgba(247,249,247,0.55)" text-anchor="end">MEMBER TIER</text>

  <!-- member -->
  <text x="112" y="338" font-family="Arial, sans-serif" font-size="19" letter-spacing="2" fill="#F7F9F7" font-weight="700">PRIYA SHARMA</text>
  <text x="112" y="358" font-family="Arial, sans-serif" font-size="11" letter-spacing="2.5" fill="rgba(143,201,193,0.8)">MEMBER SINCE 2025</text>

  <!-- card number -->
  <g fill="rgba(247,249,247,0.55)">
    <circle cx="500" cy="330" r="3.5"/><circle cx="516" cy="330" r="3.5"/><circle cx="532" cy="330" r="3.5"/><circle cx="548" cy="330" r="3.5"/>
  </g>

  <!-- sparkles -->
  <g fill="#D5B77A">
    <path d="M520 220h14v14h-14z"/>
    <path d="M527 220v14M520 227h14" stroke="#D5B77A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="492" cy="252" r="4"/>
  </g>
</svg>