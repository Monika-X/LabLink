<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Lab Test | LabLink</title>
    <link rel="stylesheet" href="../css/index.css">
    <style>
        body { background: var(--bg-primary); }
        .dashboard-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: var(--spacing-6) 0; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar-logo { padding: 0 var(--spacing-6); margin-bottom: var(--spacing-8); }
        .nav-item { display: flex; align-items: center; padding: var(--spacing-3) var(--spacing-6); color: var(--text-secondary); font-weight: 500; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: rgba(22, 134, 106, 0.1); color: var(--medical-emerald); border-right: 4px solid var(--medical-emerald); }
        .main-content { flex: 1; margin-left: 280px; padding: var(--spacing-8); }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-8); padding-bottom: var(--spacing-4); border-bottom: 1px solid var(--border-color); }
        .booking-card { background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border-color); padding: var(--spacing-8); max-width: 800px; }
        .form-control { width: 100%; padding: var(--spacing-3); border-radius: 8px; border: 1px solid var(--gray-300); background: var(--bg-primary); color: var(--text-primary); font-family: inherit; margin-top: var(--spacing-2); margin-bottom: var(--spacing-4); }
        .step-indicator { display: flex; gap: var(--spacing-4); margin-bottom: var(--spacing-8); }
        .step { flex: 1; text-align: center; padding: var(--spacing-2); border-bottom: 4px solid var(--gray-200); color: var(--text-secondary); font-weight: 600; }
        .step.active { border-bottom-color: var(--medical-emerald); color: var(--medical-emerald); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="../index.html"><h2 style="margin:0; font-weight: 700;">Lab<span style="color:var(--champagne)">Link</span></h2></a>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item">Dashboard Overview</a>
                <a href="dashboard-booking.html" class="nav-item active">Book Lab Test</a>
                <a href="dashboard-prescription.html" class="nav-item">Upload Prescription</a>
                <a href="dashboard-reports.html" class="nav-item">Report Tracking</a>
                <a href="dashboard-history.html" class="nav-item">Test History</a>
                <a href="dashboard-profile.html" class="nav-item">Profile</a>
                <a href="dashboard-settings.html" class="nav-item">Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1 style="font-size: 2rem; margin: 0;">Book a Lab Test</h1>
                    <p class="text-secondary" style="margin: 0;">Schedule a visit to our center or request home collection.</p>
                </div>
            </header>

            <div class="booking-card">
                <div class="step-indicator">
                    <div class="step active">1. Select Tests</div>
                    <div class="step">2. Patient Details</div>
                    <div class="step">3. Date & Time</div>
                </div>

                <form onsubmit="event.preventDefault(); alert('Booking Confirmed!');">
                    <label style="font-weight: 600;">Search & Select Tests</label>
                    <input type="text" class="form-control" placeholder="E.g., Complete Blood Count, Lipid Profile...">
                    
                    <div style="background: var(--bg-primary); padding: var(--spacing-4); border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: var(--spacing-6);">
                        <div style="font-weight: 600; margin-bottom: var(--spacing-2);">Selected Tests:</div>
                        <div class="flex justify-between items-center" style="padding: var(--spacing-2) 0; border-bottom: 1px dashed var(--gray-300);">
                            <span>Comprehensive Plus Health Check</span>
                            <span style="color: var(--medical-emerald); font-weight: bold;">$299</span>
                        </div>
                    </div>

                    <label style="font-weight: 600;">Collection Type</label>
                    <div class="flex gap-4 mb-4" style="margin-top: var(--spacing-2); margin-bottom: var(--spacing-6);">
                        <label style="flex: 1; padding: var(--spacing-4); border: 2px solid var(--medical-emerald); border-radius: 8px; text-align: center; cursor: pointer; background: rgba(22, 134, 106, 0.05);">
                            <input type="radio" name="collection" checked style="margin-right: 8px;"> Home Collection
                        </label>
                        <label style="flex: 1; padding: var(--spacing-4); border: 1px solid var(--gray-300); border-radius: 8px; text-align: center; cursor: pointer;">
                            <input type="radio" name="collection" style="margin-right: 8px;"> Walk-in Lab Visit
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label style="font-weight: 600;">Select Date</label>
                            <input type="date" class="form-control" required>
                        </div>
                        <div>
                            <label style="font-weight: 600;">Select Time Slot</label>
                            <select class="form-control" required>
                                <option>08:00 AM - 10:00 AM</option>
                                <option>10:00 AM - 12:00 PM</option>
                                <option>12:00 PM - 02:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: var(--spacing-6); text-align: right;">
                        <button type="submit" class="btn btn-primary">Confirm Booking</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
